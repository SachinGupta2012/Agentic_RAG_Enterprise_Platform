repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
        files: ^backend/
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
        files: ^backend/
      - id: notebook-syntax
        name: notebook syntax
        entry: uv run python scripts/check_notebooks.py
        language: system
        pass_filenames: false
        files: ^notebooks/.*\.ipynb$
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        pass_filenames: false
        files: ^backend/app/
      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        pass_filenames: false
        stages: [pre-commit]
