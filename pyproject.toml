[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-support-intelligence"
version = "0.1.0"
description = "Enterprise Support Intelligence Platform: multi-agent RAG for customer support"
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{ name = "Enterprise Support Intelligence Team" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.2.0",
    "pyjwt>=2.9.0",
    "pwdlib[argon2]>=0.2.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "tenacity>=8.5.0",
    "qdrant-client>=1.20.0",
]

[project.optional-dependencies]
orchestration = ["langgraph>=1.2.24,<2"]
data = [
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pyarrow>=17.0.0",
    "scikit-learn>=1.5.0",
    "datasets>=3.0.0",
    "kaggle>=1.6.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.66.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
]
retrieval = [
    "pandas>=2.2.0",
    "pyarrow>=17.0.0",
    "tokenizers>=0.22,<0.23",
]
ai = [
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langfuse>=2.50.0",
    "ragas>=0.2.0",
    "redis>=5.0.0",
]
notebook = [
    "ipykernel>=6.29.0",
    "jupyterlab>=4.2.0",
]
dev = [
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pre-commit>=3.8.0",
    "nbformat>=5.10.0",
]

[tool.setuptools]
package-dir = { "" = "backend" }

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.setuptools.package-data]
"app.preprocessing" = ["assets/*.json"]

[project.scripts]
support-preprocess = "app.preprocessing.cli:main"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["backend"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
mypy_path = "backend"
files = ["backend/app"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend", "."]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: read-only contracts that require a live external service",
    "slow: tests that take noticeably longer than a unit test",
]

[tool.coverage.run]
source = ["backend/app"]
omit = ["backend/app/__init__.py"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
